<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Formulario Sociométrico — SOCIOMAP</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body {
  margin: 0;
  padding: 20px;
  background: #0f172a;
  color: #e2e8f0;
  font-family: "Segoe UI", Arial, sans-serif;
  text-align: center;
}

.container {
  max-width: 1000px;
  margin: auto;
  background: rgba(255,255,255,.05);
  padding: 26px;
  border-radius: 14px;
}

h1 { margin-bottom: 6px }
p { margin-top: 0; color: #cbd5e1 }

label { display:block; margin-top:12px }

input, select {
  width:100%;
  padding:8px;
  margin-top:6px;
  border-radius:8px;
  font-size:14px;
  box-sizing:border-box;
}

.checkbox-row {
  display:flex;
  justify-content:center;
  align-items:center;
  gap:8px;
  margin-top:12px;
}

.btn {
  padding:9px 16px;
  border-radius:8px;
  border:none;
  font-weight:bold;
  cursor:pointer;
  margin-top:14px;
}

.btn-primary {
  background:#3b82f6;
  color:white;
}

.btn-primary:hover:enabled {
  background:#2563eb;
}

.btn-disabled {
  background:#475569;
  cursor:not-allowed;
  opacity:.6;
}

table {
  width:100%;
  border-collapse:collapse;
  margin-top:20px;
}

th, td {
  border:1px solid #475569;
  padding:6px;
  text-align:center;
}

th {
  background:#1e293b;
  color:white;
}

.check-ok {
  color:#22c55e;
  font-weight:bold;
}

/* RESULTADOS */
.ranking-box {
  display:none;
  background:white;
  color:black;
  border-radius:12px;
  padding:16px;
  margin-top:24px;
}

/* GRÁFICO */
.grafico-box {
  display:none;
  background:white;
  color:black;
  border-radius:12px;
  padding:16px;
  margin:24px auto 0;
  max-width:800px;
  height:420px;
  position:relative;
}
.grafico-box canvas {
  position:absolute;
  inset:60px 16px 16px 16px;
}

/* Roles */
.role-lider { background:#dcfce7 }
.role-rechazado { background:#fee2e2 }
.role-aislado { background:#e5e7eb }
.role-ambivalente { background:#fef9c3 }
.role-integrado { background:#dbeafe }

#btnSociograma {
  display:none;
}

.logo {
  height:64px;
  margin:24px auto 0;
  display:block;
}

footer {
  margin-top:10px;
  color:#94a3b8;
  font-size:14px;
}
</style>
</head>

<body>
<div class="container">

<h1>Formulario Sociométrico</h1>
<p>Completa la tabla con + / − / 0. Cada fila debe tener exactamente 3 + y 3 −.</p>

<label for="grupo">Nombre del grupo</label>
<input id="grupo" placeholder="Ej.: 3ºA, Equipo Verde">

<label for="num">Número de participantes</label>
<select id="num">
  <option value="">-- Elige --</option>
</select>

<div class="checkbox-row">
  <input type="checkbox" id="custom">
  <label for="custom">Usar nombres personalizados</label>
</div>

<input id="names" placeholder="Ana, Juan, Lucía..." style="display:none">

<button class="btn btn-primary" onclick="crearTabla()">Crear tabla</button>
<button id="btnRanking" class="btn btn-primary btn-disabled" disabled onclick="procesar()">Crear ranking</button>

<p id="mensaje" role="status" aria-live="polite"></p>
<div id="tabla"></div>
<div id="ranking" class="ranking-box"></div>

<div id="graficoBox" class="grafico-box">
  <h3>📊 Gráfico Sociométrico</h3>
  <canvas id="chart"></canvas>
</div>

<button id="btnSociograma" class="btn btn-primary" onclick="irASociograma()">CREAR SOCIOGRAMA</button>

<img src="logo.png" class="logo">
<footer>© SOCIOMAP · ARANDA TOOLS 2026</footer>

</div>

<script src="sociometria.js"></script>
<script src="formulario.js"></script>

</body>
</html>
