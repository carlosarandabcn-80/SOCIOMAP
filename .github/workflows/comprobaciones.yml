name: Comprobaciones SOCIOMAP
on:
  push:
    branches: [main, 'codex/**', 'fix/**', 'feat/**']
  pull_request:
permissions:
  contents: read
jobs:
  comprobar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - name: Instalar axe-core para auditoría automática WCAG (solo CI)
        run: npm install --no-save --no-package-lock @axe-core/playwright
      - name: Analizar seis pantallas con axe-core
        run: node tests/accesibilidad-browser.cjs
